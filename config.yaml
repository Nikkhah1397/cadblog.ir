# ===== دسته‌بندی‌ها (هر مطلب فقط یک دسته دارد) =====
categories:
  - slug: piping
    name: پایپینگ
    icon: "🛠"
    desc: طراحی لوله‌کشی، استانداردها، ساپورت، تنش لوله و ایزومتریک
  - slug: software
    name: نرم‌افزارها
    icon: "💻"
    desc: PDMS و E3D، ماکرونویسی PML، AutoCAD Plant 3D، CAESAR II و Navisworks
  - slug: process
    name: فرآیند و تجهیزات
    icon: "⚙"
    desc: P&ID، پمپ، مخزن، مبدل حرارتی و تجهیزات دوار و ثابت
  - slug: civil
    name: سازه و Civil پلنت
    icon: "🏗"
    desc: فونداسیون، پایپ‌رک، سازه‌ی فولادی و نقشه‌های عمومی پلنت
  - slug: electrical
    name: برق و ابزاردقیق
    icon: "⚡"
    desc: آشنایی مهندس پایپینگ با برق و ابزاردقیق (در حد هماهنگی بین‌رشته‌ای)
  - slug: tools
    name: ابزارها و ماکروها
    icon: "📦"
    desc: ابزارهای رایگان ساخته‌شده توسط خودمان، مثل STP2PDMS و Backing Sheet

